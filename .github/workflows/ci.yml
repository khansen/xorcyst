name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      differential_cases:
        description: Generated programs per path (larger campaigns are opt-in)
        default: '100'
        type: string
      differential_budget:
        description: Differential wall-clock budget in seconds (excludes builds)
        default: '300'
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential autoconf automake python3
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install autoconf automake
      - name: Build from checked-in generated sources
        run: |
          ./configure --disable-maintainer-mode YACC=: LEX=: HELP2MAN=: CFLAGS='-g -O2 -Werror'
          make -j2
      - name: Test source archive, installed tools, and uninstall
        run: make distcheck

  differential:
    name: Differential (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 45 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      CC: cc
      CFLAGS: -O2 -g -Werror
      DIFFERENTIAL_CASES: ${{ inputs.differential_cases || '100' }}
      DIFFERENTIAL_BUDGET: ${{ inputs.differential_budget || '300' }}
    steps:
      - name: Validate campaign limits
        run: |
          python3 - <<'PY'
          import math, os
          budget = float(os.environ['DIFFERENTIAL_BUDGET'])
          cases = int(os.environ['DIFFERENTIAL_CASES'])
          if not math.isfinite(budget) or not 0 < budget <= 1800 or not 1 <= cases <= 10000:
              raise SystemExit('CI requires 1..10000 cases per path and a budget in (0, 1800] seconds')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build candidate from checked-in sources
        run: |
          ./configure --disable-maintainer-mode YACC=: LEX=: HELP2MAN=:
          make -j2
      - name: Validate the differential harness
        run: python3 -B tests/test_differential.py
      - name: Build pinned reference and compare generated programs
        run: |
          python3 -B tests/differential/run.py \
            --candidate-dir "$GITHUB_WORKSPACE" \
            --cache "$RUNNER_TEMP/xorcyst-reference-cache" \
            --output "$RUNNER_TEMP/differential-results" \
            --binary-cases "$DIFFERENTIAL_CASES" --link-cases "$DIFFERENTIAL_CASES" \
            --budget "$DIFFERENTIAL_BUDGET"
      - name: Retain coverage, generated sources and failure bundles
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: differential-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/differential-results
            ${{ runner.temp }}/xorcyst-reference-cache/*.log
            ${{ runner.temp }}/xorcyst-reference-cache/*/build.json
          if-no-files-found: warn
          retention-days: 14

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang
      TEST_SYMTAB_CFLAGS: -O1 -g -Werror -fsanitize=address,undefined -fno-omit-frame-pointer
      TEST_BACKEND_CFLAGS: -O1 -g -Werror -fsanitize=address,undefined -fno-omit-frame-pointer
      TEST_FAULT_CFLAGS: -O1 -g -Werror -fsanitize=address,undefined -fno-omit-frame-pointer
      TEST_LINKER_CFLAGS: -O1 -g -Werror -fsanitize=address,undefined -fno-omit-frame-pointer
      TEST_ASSEMBLER_CFLAGS: -O1 -g -Werror -fsanitize=address,undefined -fno-omit-frame-pointer
      TEST_INPUT_CFLAGS: -O1 -g -Werror -fsanitize=address,undefined -fno-omit-frame-pointer
      TEST_IR_CFLAGS: -O1 -g -Werror -fsanitize=address,undefined -fno-omit-frame-pointer
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install compiler and test runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang python3
      - name: Check symbol-table and AST ownership
        run: |
          python3 tests/test_symtab.py
          python3 tests/test_backend_performance.py
      - name: Check output and allocation failure paths
        run: |
          python3 tests/test_output_failures.py
          python3 tests/test_linker_outputs.py
          python3 tests/test_inputs.py
      - name: Check shared values, layout, frontend and objects
        run: |
          python3 tests/test_ir_values.py
          python3 tests/test_ir_layout.py
          python3 tests/test_ir_frontend.py
          python3 tests/test_ir_objects.py
      - name: Check procedure instruction-analysis lifetimes
        run: |
          python3 - <<'PYTOOLS'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tests')
          from tool_test_support import build_tool
          root = Path(os.environ['RUNNER_TEMP'])
          build_tool('xasm', root / 'xasm-asan', 'TEST_ASSEMBLER_CFLAGS')
          build_tool('xlnk', root / 'xlnk-asan', 'TEST_ASSEMBLER_CFLAGS')
          PYTOOLS
          XLNK="$RUNNER_TEMP/xlnk-asan" python3 tests/test_instruction_records.py "$RUNNER_TEMP/xasm-asan" \
            InstructionRecords.test_procedure_analysis_survives_flattened_member_accesses \
            InstructionRecords.test_forward_recursive_and_empty_procedure_analysis \
            InstructionRecords.test_procedure_body_labels_keep_binary_and_record_addresses
